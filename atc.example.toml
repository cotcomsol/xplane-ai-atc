# Copy to atc.toml and edit. The API key can also come from the
# OPENROUTER_API_KEY environment variable or a .env file (./.env or ~/.env).

[xplane]
host = "localhost"
port = 8086
# X-Plane install folder, used to find apt.dat for airport/frequency data.
# Example Windows: "C:/X-Plane 12"   Example Linux: "/home/me/X-Plane 12"
path = ""
# X-Plane command to bind to your yoke PTT button (Settings > Joystick).
ptt_command = "sim/operation/contact_atc"

[pilot]
# Leave empty to use the aircraft tail number from X-Plane.
callsign = ""

[simbrief]
# Your SimBrief username (or numeric user id, from simbrief.com Account Settings). The latest flight
# plan you generated there is used for IFR clearances: destination, departure procedure, first fix and
# cruise altitude. It is fetched at startup and again when you call ground or clearance delivery.
# Leave empty to say your destination on the radio instead.
username = ""

[openrouter]
api_key = ""
stt_model = "openai/gpt-4o-mini-transcribe"
chat_model = "openai/gpt-5.6-luna"
# Also good: "anthropic/claude-haiku-5.5" with reasoning_effort = "low" (smarter, ~3s per reply)
# "none" turns model reasoning off (about 1s replies); "low"/"medium" are smarter but 3-5s slower.
reasoning_effort = "none"
tts_model = "hexgrad/kokoro-82m"
# Voices are picked per facility from this list so ground/tower/approach sound different.
tts_voices = ["am_michael", "am_adam", "am_eric", "am_liam", "am_onyx", "af_heart", "af_sarah", "af_nicole"]
tts_speed = 1.3
# The voice must read digit words literally ("three zero zero", not "three hundred").
# Verified OK: kokoro, google/gemini-3.8-flash-lite-tts, x-ai/grok-voice-tts-1.0.
# NOT OK: microsoft/mai-voice-* (says "three hundred"), elevenlabs (reads words as digits).
# Gemini alternative (sounds most like ATC, follows tts_instructions, ~2s to start):
#   tts_model = "google/gemini-3.8-flash-lite-tts"
#   tts_voices = ["Charon", "Fenrir", "Orus", "Kore", "Puck", "Iapetus"]
#   tts_speed = 1.0
# Grok alternative (fastest start ~0.5s, ignores speed, a bit slow-paced):
#   tts_model = "x-ai/grok-voice-tts-1.0"
#   tts_voices = ["rex", "sal", "leo", "eve", "ara"]
#   tts_speed = 1.0
# Stronger model for `atc debrief` (post-flight review of the session log), ~$0.25-0.40 per flight
debrief_model = "anthropic/claude-opus-5.5"
tts_instructions = "You are a busy US air traffic controller on the radio. Speak fast, flat and clipped, no emotion."

[audio]
# Device names or indexes from `atc devices`; empty = system default.
input_device = ""
output_device = ""
radio_effect = true
# Start playing the controller's voice before the whole transmission is generated
stream_voice = true
# "local": Kokoro voices generated on this computer (CPU, ~0.3 s to first audio, free; downloads
# ~120 MB of model files into cache/ the first time). "openrouter": tts_model above (network wait
# varies from 0.5 s to 20 s). If the local voice fails it falls back to OpenRouter.
voice_engine = "local"
# CPU threads for the local voice (2 is enough on most machines; more = faster first audio)
voice_threads = 4
# Speech-to-text. "openrouter": stt_model above (~0.6-1 s, gets your callsign as a hint).
# "local": NVIDIA Parakeet on this computer's CPU (~0.2 s, free; downloads ~620 MB into cache/ the
# first time; no hint, so it misses "niner" now and then). Falls back to OpenRouter if it can't load.
stt_engine = "openrouter"
# CPU threads for local speech-to-text
stt_threads = 4
# Keep each push-to-talk recording as a WAV in logs/flight-<date>-<time>-audio/, with what the
# speech-to-text model heard, for comparing speech-to-text models (tools/stt_bench.py).
save_recordings = false

[chatter]
# Other aircraft talking to your controller. "always": X-Plane AI traffic when there is any, otherwise
# made-up aircraft; "traffic": only real AI traffic; "off". About $0.001 per exchange.
mode = "always"
# Seconds between exchanges (random in this range)
min_gap = 45
max_gap = 120
