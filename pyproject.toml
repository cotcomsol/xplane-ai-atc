[project]
name = "atc"
version = "0.3.1"
description = "AI air traffic control companion for X-Plane 12"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "scipy>=1.13",
    "kokoro-onnx>=0.4",
    "onnx-asr[cpu,hub]>=0.12",
]

[project.scripts]
atc = "atc.main:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atc"]
